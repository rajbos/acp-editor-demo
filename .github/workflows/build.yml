name: Build Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-broker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build broker image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/tools
          file: ./packages/tools/Dockerfile
          push: false
          tags: acp-editor/broker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-agent-bridge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agent-bridge image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/agent-bridge
          file: ./packages/agent-bridge/Dockerfile
          push: false
          tags: acp-editor/agent-bridge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build client image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/client
          file: ./packages/client/Dockerfile
          push: false
          tags: acp-editor/client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
